<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notificações e recomendações — Fiolib</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<style>
  @font-face{font-family:Literata;src:url(/fontes/literata-latin.woff2) format('woff2');font-display:swap}
  @font-face{font-family:Inter;src:url(/fontes/inter-latin.woff2) format('woff2');font-display:swap}
  :root{--papel:#f8f5ee;--papel2:#efe9dd;--tinta:#1f1b16;--tinta2:#6d655a;--linha:#e1d9ca;--acento:#7a2e2e;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--papel:#15130f;--papel2:#1e1b16;--tinta:#ece5d6;--tinta2:#a39a8a;--linha:#2d2922;--acento:#c46a5c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.55 Inter,system-ui,sans-serif}
  a{color:inherit}
  main{max-width:1080px;margin:0 auto;padding:28px 16px 90px}
  h1{font-family:Literata,Georgia,serif;font-weight:500;font-size:clamp(26px,4vw,38px);margin:0 0 6px;line-height:1.15}
  .sub{color:var(--tinta2);margin:0 0 26px;max-width:62ch}
  .grade{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .livro{text-decoration:none;display:block}
  .capa{aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 22px -14px rgba(0,0,0,.55);background:var(--papel2);position:relative;transition:transform .2s}
  .livro:hover .capa{transform:translateY(-3px)}
  .capa img{width:100%;height:100%;object-fit:cover;display:block}
  .desenhada{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:14px;text-align:center;font-family:Literata,Georgia,serif;font-size:14px;line-height:1.3}
  .tit{font-family:Literata,Georgia,serif;font-size:14px;line-height:1.3;margin-top:9px}
  .aut{font-size:12px;color:var(--tinta2);margin-top:2px}
  .motivo{font-size:12px;color:var(--acento);margin-top:5px;line-height:1.35}
  .cartao{background:var(--papel2);border:1px solid var(--linha);border-radius:12px;padding:20px 22px;margin-bottom:14px}
  .passo{margin:0 0 30px}
  .passo h2{font-family:Literata,Georgia,serif;font-weight:500;font-size:20px;margin:0 0 4px}
  .passo p{color:var(--tinta2);margin:0 0 14px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--linha);background:transparent;color:var(--tinta);font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--acento);border-color:var(--acento);color:#fff}
  .escolha{cursor:pointer;border:none;background:none;padding:0;text-align:left;font:inherit;color:inherit}
  .escolha .capa{outline:3px solid transparent;outline-offset:3px}
  .escolha[aria-pressed=true] .capa{outline-color:var(--acento)}
  .escolha[aria-pressed=true] .tit::before{content:'✓ ';color:var(--acento)}
  .botao{background:var(--acento);color:#fff;border:none;border-radius:8px;padding:12px 22px;font:inherit;font-size:15px;cursor:pointer}
  .botao:disabled{opacity:.5}
  .fraco{background:none;border:1px solid var(--linha);color:var(--tinta);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
  /* notificações: a página inteira do sino (central.js, mostrarAvisos) */
  .notif-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .notif-topo h1{margin:0}
  .notif-filtros{display:flex;gap:8px;margin:14px 0 6px}
  .notif-filtros button{border:1px solid var(--linha);background:none;color:var(--tinta2);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .notif-filtros [aria-selected=true]{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
  .notif-grupo h2{font:600 12px Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);margin:22px 0 8px}
  .notif-grupo ul{list-style:none;margin:0;padding:0;border:1px solid var(--linha);border-radius:14px;overflow:hidden;background:var(--papel)}
  .notif{border-bottom:1px solid var(--linha)}
  .notif:last-child{border-bottom:none}
  .notif button{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:none;background:none;color:var(--tinta);font:inherit;cursor:pointer;position:relative}
  .notif button:hover{background:color-mix(in srgb,var(--tinta) 4%,transparent)}
  .notif.novo button{background:color-mix(in srgb,var(--acento) 7%,transparent)}
  .notif .ic{flex:none;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--tinta) 8%,transparent);color:var(--tinta2)}
  .notif .ic-seguranca{background:color-mix(in srgb,#c0392b 15%,transparent);color:#c0392b}
  .notif .ic-boasvindas,.notif .ic-titulo{background:color-mix(in srgb,#b08d57 22%,transparent);color:#9a7328}
  .notif .txt{display:flex;flex-direction:column;gap:3px;min-width:0;padding-right:18px}
  .notif b{font-weight:600;font-size:15px;line-height:1.35}
  .notif .txt span{color:var(--tinta2);font-size:14px;line-height:1.45}
  .notif time{color:var(--acento);font-size:12px}
  .notif .ponto{position:absolute;right:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:999px;background:var(--acento)}
  .notif-vazio{border:1px dashed var(--linha);border-radius:14px;padding:34px 22px;text-align:center;color:var(--tinta2);margin-top:18px}
  .notif-vazio b{display:block;color:var(--tinta);font-size:16px;margin-bottom:6px}
  .contagem{background:var(--acento);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:5px}
  .vazio{color:var(--tinta2);padding:28px 0}
  .recado{padding:12px 16px;border-radius:8px;margin-bottom:18px;background:color-mix(in srgb,var(--acento) 12%,transparent);color:var(--acento)}
  @media (max-width:560px){
    .grade{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  }
</style>
<link rel="stylesheet" href="/fio-temas.css">
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
</head>
<body data-area="central" data-sub="central" data-sub-atual="recs">
<main id="main"><p class="vazio">abrindo…</p></main>
<script src="/fio-cabecalho.js"></script>
<script src="/central.js"></script>
</body>
</html>
