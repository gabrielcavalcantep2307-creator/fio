<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lendo — Fio</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<style>
  @font-face{font-family:Inter;src:url(/fontes/inter-latin.woff2) format('woff2');font-display:swap}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d0c0b;color:#e9e4da;font:14px/1.4 Inter,system-ui,sans-serif;overscroll-behavior:none}
  button,select{font:inherit;color:inherit}
  .ui{position:fixed;left:0;right:0;z-index:10;background:rgba(13,12,11,.9);backdrop-filter:blur(10px);transition:transform .25s,opacity .25s}
  .cima{top:0;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid #2a2724}
  .baixo{bottom:0;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid #2a2724;display:flex;align-items:center;gap:12px}
  .escondida .cima{transform:translateY(-100%);opacity:0}
  .escondida .baixo{transform:translateY(100%);opacity:0}
  .ic{background:none;border:1px solid #34302b;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
  .ic[aria-pressed=true]{background:#e9e4da;color:#0d0c0b;border-color:#e9e4da}
  .titulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .titulo b{font-weight:600}
  .titulo span{color:#9d958a;margin-left:6px}
  select{background:#1b1917;border:1px solid #34302b;border-radius:8px;padding:6px;max-width:200px}
  input[type=range]{flex:1;accent-color:#c46a5c}
  .contador{font-variant-numeric:tabular-nums;color:#b8b0a4;min-width:64px;text-align:center}
  .grupo{display:flex;gap:6px}
  @media (max-width:640px){.so-grande{display:none}.titulo span{display:none}}

  /* rolagem: coluna contínua */
  #rolagem{padding:60px 0 90px;display:flex;flex-direction:column;align-items:center}
  #rolagem img{width:100%;max-width:900px;display:block;min-height:40vh;background:#161412}
  #rolagem img[data-carregada]{min-height:0}

  /* página e dupla: palco em tela cheia */
  #palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:0;touch-action:pan-y pinch-zoom}
  #palco img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  #palco.dupla img{max-width:50%}
  #palco.zoom{overflow:auto;display:block}
  #palco.zoom img{max-width:none;max-height:none;width:min(200%,2400px)}
  .zona{position:fixed;top:0;bottom:0;width:30%;z-index:5;cursor:pointer}
  .zona.esq{left:0}.zona.dir{right:0}

  .fim{max-width:560px;margin:0 auto;padding:40px 20px 120px;text-align:center}
  .fim h2{font-weight:500;font-size:22px;margin:0 0 10px}
  .fim p{color:#b8b0a4}
  .fim .proximo{display:inline-block;margin-top:14px;background:#c46a5c;color:#fff;text-decoration:none;border-radius:8px;padding:12px 22px}
  .fim a{color:#e9e4da}
  #fimPagina{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d0c0b;z-index:6;overflow:auto}
  /* tradução sobre os balões: uma camada do tamanho da imagem, com caixas em % */
  .camada{position:absolute;pointer-events:none;z-index:3}
  .camada .balao{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:rgba(255,252,242,.97);color:#16130f;border-radius:7px;padding:1px 3px;font-weight:600;line-height:1.08;letter-spacing:-.01em;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .camada .balao.duvida{box-shadow:0 0 0 1.5px #d9a441}
  #rolagem .folha{position:relative;width:100%;max-width:900px}
  #rolagem .folha img{max-width:none}
  .dica{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);padding:14px 18px;border-radius:12px;z-index:20;text-align:center;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<div id="app">
  <div class="ui cima">
    <a class="ic" id="voltar" href="/quadrinhos.html" aria-label="Voltar à série">←</a>
    <div class="titulo" id="titulo"></div>
    <select id="capitulo" aria-label="Capítulo"></select>
    <div class="grupo">
      <button class="ic" data-modo="rolagem" title="Rolagem contínua">rolagem</button>
      <button class="ic" data-modo="pagina" title="Uma página por vez">página</button>
      <button class="ic so-grande" data-modo="dupla" title="Duas páginas lado a lado">dupla</button>
    </div>
    <button class="ic" id="sentido" title="Sentido de leitura"></button>
    <button class="ic" id="traducao" title="Mostrar a tradução sobre os balões (T)" hidden>PT</button>
    <button class="ic so-grande" id="tela" title="Tela cheia (F)">⛶</button>
  </div>
  <div id="rolagem" hidden></div>
  <div id="palco" hidden></div>
  <div id="fimPagina"></div>
  <div class="zona esq" id="zonaEsq" hidden></div>
  <div class="zona dir" id="zonaDir" hidden></div>
  <div class="ui baixo">
    <button class="ic" id="anterior" aria-label="Página anterior">‹</button>
    <input type="range" id="barra" min="0" value="0" aria-label="Posição no capítulo">
    <button class="ic" id="seguinte" aria-label="Próxima página">›</button>
    <span class="contador" id="contador"></span>
  </div>
</div>
<script src="/fio-dono.js"></script>
<script src="/leitor-quadrinho.js"></script>
</body>
</html>
