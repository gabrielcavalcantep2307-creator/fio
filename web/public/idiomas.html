<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idiomas — Fiolib</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<link rel="stylesheet" href="/fio-paginas.css">
<link rel="stylesheet" href="/fio-temas.css">
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
<style>
  main{max-width:1080px}

  /* ── grade de idiomas ── */
  .topo-idiomas{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .selo-tear{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ouro) 16%,transparent);color:var(--ouro);border:1px solid color-mix(in srgb,var(--ouro) 45%,var(--linha));border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .grade-idiomas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .cartao-idioma{background:var(--papel2);border:1px solid var(--linha);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
  .cartao-idioma:hover{border-color:var(--acento);box-shadow:0 2px 12px color-mix(in srgb,var(--acento) 12%,transparent)}
  .cartao-idioma[disabled]{opacity:.55;cursor:default}
  .cartao-idioma .bandeira{font-size:34px;line-height:1}
  .cartao-idioma h3{margin:0;font:500 19px Literata,Georgia,serif;text-transform:none;letter-spacing:0;color:var(--tinta)}
  .cartao-idioma .prof{font-size:12px;color:var(--tinta2)}
  .cartao-idioma .barra{height:5px;border-radius:3px;background:var(--linha);overflow:hidden;margin-top:2px}
  .cartao-idioma .barra i{display:block;height:100%;background:var(--acento)}

  /* ── estudo: sidebar + conteúdo ── */
  .estudo{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .lista-unidades{position:sticky;top:110px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow-y:auto}
  .item-unidade{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;text-align:left;background:none;border:none;font:inherit;font-size:13.5px;color:var(--tinta2);cursor:pointer;transition:background .1s}
  .item-unidade:hover{background:var(--papel2)}
  .item-unidade[aria-current=true]{background:var(--papel2);color:var(--tinta);font-weight:600}
  .item-unidade .marca{width:18px;text-align:center;flex:none}
  .item-unidade.feita .marca{color:var(--bom)}

  /* ── abas ── */
  .abas{display:flex;gap:0;border-bottom:2px solid var(--linha);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .aba{padding:11px 18px;border:none;background:none;font:inherit;font-size:13.5px;color:var(--tinta2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
  .aba:hover{color:var(--tinta)}
  .aba.ativa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  .conteudo-aba{display:none;flex-direction:column;gap:22px}
  .conteudo-aba.visivel{display:flex}

  /* ── blocos ── */
  .licao{display:flex;flex-direction:column;gap:0}
  .bloco{background:var(--caixa,var(--papel2));border:1px solid var(--linha);border-radius:14px;padding:18px 20px}
  .bloco h2{margin-top:0}
  .bloco-titulo{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .bloco-titulo .ico{font-size:18px}

  /* ── vocabulário ── */
  .vocab{display:flex;flex-direction:column;gap:10px}
  .palavra{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
  .palavra:first-child{border-top:none}
  .palavra .fala{flex:none;background:none;border:1px solid var(--linha);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--acento);transition:border-color .15s}
  .palavra .fala:hover{border-color:var(--acento)}
  .palavra .txt{flex:1;min-width:0}
  .palavra .orig{font:500 16px Literata,Georgia,serif}
  .palavra .trad{color:var(--tinta2);font-size:13.5px}
  .palavra .exemplo{margin-top:4px;font-size:13px;color:var(--tinta2);font-style:italic}

  /* ── gramática ── */
  .gramatica{line-height:1.7;font-size:14.5px}
  .gramatica-regra{font:500 15px/1.5 Literata,Georgia,serif;margin-bottom:10px}
  .gramatica-explicacao{margin-bottom:12px}
  .gramatica-exemplos{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:color-mix(in srgb,var(--acento) 6%,transparent);border-radius:10px}
  .gramatica-ex{display:flex;flex-direction:column;gap:2px}
  .gramatica-ex .frase{font:italic 14.5px Literata,Georgia,serif}
  .gramatica-ex .trad{font-size:12.5px;color:var(--tinta2)}

  /* ── diálogo ── */
  .dialogo{display:flex;flex-direction:column;gap:10px;padding:4px 0}
  .dialogo-situacao{font-size:13px;color:var(--tinta2);font-style:italic;margin-bottom:6px}
  .fala-linha{display:flex;gap:10px;align-items:flex-start}
  .fala-linha.dir{flex-direction:row-reverse}
  .fala-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .fala-avatar.a{background:color-mix(in srgb,var(--acento) 18%,var(--papel));color:var(--acento)}
  .fala-avatar.b{background:color-mix(in srgb,var(--ouro) 18%,var(--papel));color:var(--ouro)}
  .fala-bolha{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .fala-bolha.a{background:color-mix(in srgb,var(--acento) 10%,var(--papel));border-bottom-left-radius:4px}
  .fala-bolha.b{background:color-mix(in srgb,var(--ouro) 10%,var(--papel));border-bottom-right-radius:4px}
  .fala-trad{font-size:12px;color:var(--tinta2);font-style:italic;margin-top:3px;cursor:pointer;user-select:none}

  /* ── expressões ── */
  .expressoes{display:flex;flex-direction:column;gap:2px}
  .expressao-item{padding:10px 0;border-top:1px solid var(--linha)}
  .expressao-item:first-child{border-top:none}
  .expressao-frase{font:500 15px Literata,Georgia,serif}
  .expressao-sig{font-size:13px;color:var(--tinta2);margin-top:3px}
  .expressao-uso{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:2px}

  /* ── cultura ── */
  .cultura-nota{padding:14px 16px;background:color-mix(in srgb,var(--acento) 7%,transparent);border-left:3px solid var(--acento);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.7}

  /* ── associação e dica ── */
  .assoc{padding:12px 14px;background:color-mix(in srgb,var(--ouro) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}
  .assoc b{color:var(--ouro)}
  .dica{padding:12px 14px;background:color-mix(in srgb,var(--bom) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}

  /* ── flashcards ── */
  .flashcards-area{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0}
  .flashcard-progresso{font-size:13px;color:var(--tinta2);display:flex;align-items:center;gap:12px}
  .flashcard-barra{width:200px;height:5px;border-radius:3px;background:var(--linha);overflow:hidden}
  .flashcard-barra i{display:block;height:100%;background:var(--acento);transition:width .3s}
  .flashcard{width:100%;max-width:420px;min-height:220px;perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flashcard-inner{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d}
  .flashcard.virada .flashcard-inner{transform:rotateY(180deg)}
  .flashcard-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-radius:16px;border:2px solid var(--linha);text-align:center}
  .flashcard-frente{background:var(--papel2)}
  .flashcard-verso{transform:rotateY(180deg);background:color-mix(in srgb,var(--bom) 8%,var(--papel2));border-color:color-mix(in srgb,var(--bom) 40%,var(--linha))}
  .flashcard-palavra{font:500 26px Literata,Georgia,serif}
  .flashcard-instrucao{font-size:12px;color:var(--tinta2);margin-top:10px}
  .flashcard-traducao{font:500 22px Literata,Georgia,serif;color:var(--bom)}
  .flashcard-exemplo{font-size:13px;color:var(--tinta2);margin-top:10px;font-style:italic}
  .flashcard-acoes{display:flex;gap:12px;margin-top:6px}
  .flashcard-acoes button{padding:10px 24px;border-radius:8px;border:1px solid var(--linha);font:inherit;font-size:14px;cursor:pointer;transition:background .1s}
  .flashcard-acoes .nao-sei{background:color-mix(in srgb,var(--acento) 10%,var(--papel));color:var(--acento);border-color:color-mix(in srgb,var(--acento) 30%,var(--linha))}
  .flashcard-acoes .nao-sei:hover{background:color-mix(in srgb,var(--acento) 18%,var(--papel))}
  .flashcard-acoes .sei{background:color-mix(in srgb,var(--bom) 10%,var(--papel));color:var(--bom);border-color:color-mix(in srgb,var(--bom) 30%,var(--linha))}
  .flashcard-acoes .sei:hover{background:color-mix(in srgb,var(--bom) 18%,var(--papel))}
  .flashcard-resumo{text-align:center;padding:30px 20px}
  .flashcard-resumo .nota{font:500 48px Literata,Georgia,serif;color:var(--acento);margin-bottom:8px}
  .flashcard-embaralhar{background:none;border:1px solid var(--linha);border-radius:8px;padding:6px 14px;font:inherit;font-size:12.5px;color:var(--tinta2);cursor:pointer}
  .flashcard-embaralhar:hover{border-color:var(--acento);color:var(--acento)}

  /* ── vídeo e canção ── */
  .video-embutido{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
  .video-embutido iframe{width:100%;height:100%;border:0}
  .video-link-direto{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--tinta2)}
  .video-link-direto a{color:var(--acento)}
  .cancao-letra{white-space:pre-line;font:italic 15px/1.7 Literata,Georgia,serif;color:var(--tinta)}
  .musica-trecho{padding:10px 14px;background:color-mix(in srgb,var(--acento) 5%,transparent);border-radius:10px;margin-top:8px}
  .musica-trecho .original{font:14px/1.6 Literata,Georgia,serif}
  .musica-trecho .traducao-trecho{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:4px}

  /* ── quiz ── */
  .quiz-pergunta{font:500 17px Literata,Georgia,serif;margin-bottom:14px}
  .opcoes{display:flex;flex-direction:column;gap:8px}
  .opcao{text-align:left;padding:11px 14px;border:1px solid var(--linha);border-radius:9px;background:var(--papel);font:inherit;font-size:14.5px;cursor:pointer;color:var(--tinta);transition:border-color .15s}
  .opcao:hover{border-color:var(--acento)}
  .opcao.certa{border-color:var(--bom);background:color-mix(in srgb,var(--bom) 12%,var(--papel))}
  .opcao.errada{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 12%,var(--papel))}
  .opcao:disabled{cursor:default}
  .quiz-resultado{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .quiz-placar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--papel2);border-radius:10px;margin-bottom:14px;font-size:13.5px}
  .quiz-placar .acertos{font:600 18px Literata,Georgia,serif;color:var(--bom)}
  .campo-resposta{display:flex;gap:8px;flex-wrap:wrap}
  .campo-resposta input{flex:1;min-width:180px}

  /* ── bloqueio ── */
  .bloqueio{text-align:center;padding:50px 20px}
  .bloqueio .bandeiras{font-size:40px;letter-spacing:8px;margin-bottom:6px}

  @media(max-width:760px){
    .estudo{grid-template-columns:1fr}
    .lista-unidades{position:static;flex-direction:row;overflow-x:auto;max-height:none}
    .item-unidade{white-space:nowrap}
    .fala-bolha{max-width:88%}
    .flashcard{max-width:100%}
    .abas{gap:0}
    .aba{padding:10px 14px;font-size:13px}
    .flashcard-acoes{flex-wrap:wrap;justify-content:center}
  }
</style>
</head>
<body data-area="idiomas">
<main id="main"><p class="sub">abrindo…</p></main>
<script src="/fio-cabecalho.js"></script>
<script src="/fio-comum.js"></script>
<script src="/idiomas.js"></script>
</body>
</html>
