<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idiomas — Fiolib</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<link rel="stylesheet" href="/fio-paginas.css">
<link rel="stylesheet" href="/fio-temas.css">
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
<style>
  main{max-width:1080px}

  /* ── grade de idiomas ── */
  .topo-idiomas{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .selo-tear{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ouro) 16%,transparent);color:var(--ouro);border:1px solid color-mix(in srgb,var(--ouro) 45%,var(--linha));border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .grade-idiomas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .cartao-idioma{background:var(--papel2);border:1px solid var(--linha);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
  .cartao-idioma:hover{border-color:var(--acento);box-shadow:0 2px 12px color-mix(in srgb,var(--acento) 12%,transparent)}
  .cartao-idioma[disabled]{opacity:.55;cursor:default}
  .cartao-idioma .bandeira{font-size:34px;line-height:1}
  .cartao-idioma h3{margin:0;font:500 19px Literata,Georgia,serif;text-transform:none;letter-spacing:0;color:var(--tinta)}
  .cartao-idioma .prof{font-size:12px;color:var(--tinta2)}

  /* ── topo do idioma (hero) ── */
  .topo-idioma{margin-bottom:0}
  .voltar-link{font-size:13px;color:var(--tinta2);text-decoration:none}
  .voltar-link:hover{color:var(--acento)}
  .idioma-hero{display:flex;align-items:center;gap:16px;margin-top:8px}
  .idioma-bandeira{font-size:52px;line-height:1}
  .idioma-hero h1{font:600 28px Literata,Georgia,serif;color:var(--tinta)}
  .saudacao-nativa{margin:4px 0 0;font:italic 14px/1.5 Literata,Georgia,serif;color:var(--tinta2)}

  /* ── navegacao por secoes ── */
  .secao-nav{display:flex;gap:0;border-bottom:2px solid var(--linha);margin:18px 0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .secao-btn{padding:12px 18px;border:none;background:none;font:inherit;font-size:14px;color:var(--tinta2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
  .secao-btn:hover{color:var(--tinta)}
  .secao-btn.ativa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  .secao-conteudo{display:flex;flex-direction:column;gap:20px}

  /* ── painel principal (dashboard) ── */
  .painel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
  .stat{background:var(--papel2);border:1px solid var(--linha);border-radius:12px;padding:18px 16px;text-align:center}
  .stat-num{font:600 28px Literata,Georgia,serif;color:var(--acento)}
  .stat-label{font-size:12px;color:var(--tinta2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  .painel-acoes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .painel-secoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .painel-card{display:flex;align-items:flex-start;gap:14px;padding:18px;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .painel-card:hover{border-color:var(--acento);box-shadow:0 2px 12px color-mix(in srgb,var(--acento) 10%,transparent)}
  .painel-card-ico{font-size:28px;flex:none}
  .painel-card h3{margin:0 0 2px;font:500 16px Literata,Georgia,serif}
  .painel-card p{margin:0;font-size:12.5px;color:var(--tinta2)}

  /* ── unidades em abas horizontais ── */
  .unidades-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 14px;margin-bottom:8px;scrollbar-width:thin}
  .unidade-tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--linha);border-radius:10px;background:var(--papel2);font:inherit;font-size:13px;color:var(--tinta2);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
  .unidade-tab:hover{border-color:var(--acento);color:var(--tinta)}
  .unidade-tab.ativa{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 10%,var(--papel2));color:var(--acento);font-weight:600}
  .unidade-tab.feita{border-color:color-mix(in srgb,var(--bom) 40%,var(--linha))}
  .unidade-tab.feita .tab-num{color:var(--bom)}
  .tab-num{font-weight:700;font-size:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--acento) 10%,transparent)}
  .unidade-tab.ativa .tab-num{background:color-mix(in srgb,var(--acento) 20%,transparent);color:var(--acento)}
  .tab-titulo{max-width:140px;overflow:hidden;text-overflow:ellipsis}

  /* ── abas ── */
  .abas{display:flex;gap:0;border-bottom:2px solid var(--linha);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .aba{padding:11px 18px;border:none;background:none;font:inherit;font-size:13.5px;color:var(--tinta2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
  .aba:hover{color:var(--tinta)}
  .aba.ativa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  .conteudo-aba{display:none;flex-direction:column;gap:22px}
  .conteudo-aba.visivel{display:flex}

  /* ── blocos ── */
  .licao{display:flex;flex-direction:column;gap:0}
  .bloco{background:var(--caixa,var(--papel2));border:1px solid var(--linha);border-radius:14px;padding:18px 20px}
  .bloco h2{margin-top:0}
  .bloco-titulo{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .bloco-titulo .ico{font-size:18px}
  .nivel-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--acento);text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;background:color-mix(in srgb,var(--acento) 10%,transparent);border-radius:4px;margin-top:6px}

  /* ── vocabulario ── */
  .vocab{display:flex;flex-direction:column;gap:10px}
  .palavra{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
  .palavra:first-child{border-top:none}
  .palavra .fala,.fala.mini{flex:none;background:none;border:1px solid var(--linha);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--acento);transition:border-color .15s;display:inline-flex;align-items:center;justify-content:center}
  .fala.mini{width:28px;height:28px;font-size:13px}
  .fala.card-fala{position:absolute;top:12px;right:12px;z-index:1}
  .palavra .fala:hover,.fala.mini:hover{border-color:var(--acento)}
  .palavra .txt{flex:1;min-width:0}
  .palavra .orig,.resultado-item .orig{font:500 16px Literata,Georgia,serif}
  .palavra .trad,.resultado-item .trad{color:var(--tinta2);font-size:13.5px}
  .palavra .exemplo,.resultado-item .exemplo{margin-top:4px;font-size:13px;color:var(--tinta2);font-style:italic}

  /* ── gramatica ── */
  .gramatica{line-height:1.7;font-size:14.5px}
  .gramatica-regra{font:500 15px/1.5 Literata,Georgia,serif;margin-bottom:10px}
  .gramatica-explicacao{margin-bottom:12px}
  .gramatica-exemplos{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:color-mix(in srgb,var(--acento) 6%,transparent);border-radius:10px}
  .gramatica-ex{display:flex;flex-direction:column;gap:2px}
  .gramatica-ex .frase{font:italic 14.5px Literata,Georgia,serif}
  .gramatica-ex .trad{font-size:12.5px;color:var(--tinta2)}

  /* ── dialogo ── */
  .dialogo{display:flex;flex-direction:column;gap:10px;padding:4px 0}
  .dialogo-situacao{font-size:13px;color:var(--tinta2);font-style:italic;margin-bottom:6px}
  .fala-linha{display:flex;gap:10px;align-items:flex-start}
  .fala-linha.dir{flex-direction:row-reverse}
  .fala-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .fala-avatar.a{background:color-mix(in srgb,var(--acento) 18%,var(--papel));color:var(--acento)}
  .fala-avatar.b{background:color-mix(in srgb,var(--ouro) 18%,var(--papel));color:var(--ouro)}
  .fala-bolha{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .fala-bolha.a{background:color-mix(in srgb,var(--acento) 10%,var(--papel));border-bottom-left-radius:4px}
  .fala-bolha.b{background:color-mix(in srgb,var(--ouro) 10%,var(--papel));border-bottom-right-radius:4px}
  .fala-trad{font-size:12px;color:var(--tinta2);font-style:italic;margin-top:3px;cursor:pointer;user-select:none}

  /* ── expressoes ── */
  .expressoes{display:flex;flex-direction:column;gap:2px}
  .expressao-item{padding:10px 0;border-top:1px solid var(--linha)}
  .expressao-item:first-child{border-top:none}
  .expressao-frase{font:500 15px Literata,Georgia,serif}
  .expressao-sig{font-size:13px;color:var(--tinta2);margin-top:3px}
  .expressao-uso{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:2px}

  /* ── cultura ── */
  .cultura-nota{padding:14px 16px;background:color-mix(in srgb,var(--acento) 7%,transparent);border-left:3px solid var(--acento);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.7}

  /* ── associacao e dica ── */
  .assoc{padding:12px 14px;background:color-mix(in srgb,var(--ouro) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}
  .assoc b{color:var(--ouro)}
  .dica{padding:12px 14px;background:color-mix(in srgb,var(--bom) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}

  /* ── flashcards ── */
  .flashcards-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
  .flashcard-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
  .flashcard-progresso{display:flex;align-items:center;gap:12px;width:100%;max-width:420px}
  .progresso-txt{font-size:13px;color:var(--tinta2);white-space:nowrap}
  .flashcard-barra{flex:1;height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
  .flashcard-barra i{display:block;height:100%;background:var(--acento);border-radius:3px;transition:width .3s}
  .flashcard-container{width:100%;display:flex;justify-content:center}
  .flashcard{width:100%;max-width:420px;min-height:240px;perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flashcard-inner{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
  .flashcard.virada .flashcard-inner{transform:rotateY(180deg)}
  .flashcard-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-radius:18px;border:2px solid var(--linha);text-align:center;box-shadow:0 4px 20px color-mix(in srgb,var(--tinta) 6%,transparent)}
  .flashcard-frente{background:var(--papel2)}
  .flashcard-verso{transform:rotateY(180deg);background:color-mix(in srgb,var(--bom) 8%,var(--papel2));border-color:color-mix(in srgb,var(--bom) 40%,var(--linha))}
  .flashcard-palavra{font:500 28px Literata,Georgia,serif}
  .flashcard-instrucao{font-size:12px;color:var(--tinta2);margin-top:12px;opacity:.7}
  .flashcard-traducao{font:500 24px Literata,Georgia,serif;color:var(--bom)}
  .flashcard-exemplo{font-size:13px;color:var(--tinta2);margin-top:10px;font-style:italic}
  .flashcard-acoes{display:flex;gap:14px;margin-top:8px}
  .flashcard-acoes button{padding:12px 30px;border-radius:10px;border:2px solid var(--linha);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s}
  .flashcard-acoes button:active{transform:scale(.96)}
  .flashcard-acoes .nao-sei{background:color-mix(in srgb,var(--acento) 10%,var(--papel));color:var(--acento);border-color:color-mix(in srgb,var(--acento) 30%,var(--linha))}
  .flashcard-acoes .nao-sei:hover{background:color-mix(in srgb,var(--acento) 18%,var(--papel))}
  .flashcard-acoes .sei{background:color-mix(in srgb,var(--bom) 10%,var(--papel));color:var(--bom);border-color:color-mix(in srgb,var(--bom) 30%,var(--linha))}
  .flashcard-acoes .sei:hover{background:color-mix(in srgb,var(--bom) 18%,var(--papel))}
  .flashcard-resumo{text-align:center;padding:30px 20px}
  .flashcard-resumo .nota{font:500 52px Literata,Georgia,serif;color:var(--acento);margin-bottom:6px}
  .flashcard-resumo .resumo-txt{font-size:16px;color:var(--tinta);margin-bottom:6px}
  .flashcard-resumo .resumo-msg{font-size:13.5px;color:var(--tinta2);line-height:1.5}
  .flashcard-embaralhar{background:none;border:1px solid var(--linha);border-radius:8px;padding:6px 14px;font:inherit;font-size:12.5px;color:var(--tinta2);cursor:pointer}
  .flashcard-embaralhar:hover{border-color:var(--acento);color:var(--acento)}

  /* ── youtube thumbnail e player ── */
  .yt-thumb{display:block;position:relative;width:100%;max-width:560px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;text-decoration:none}
  .yt-thumb img{width:100%;height:100%;object-fit:cover}
  .yt-thumb .yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;background:rgba(0,0,0,.25);transition:background .2s}
  .yt-thumb:hover .yt-play{background:rgba(0,0,0,.45)}
  .yt-player-wrap{width:100%;max-width:560px;aspect-ratio:16/9;margin:12px auto 0;border-radius:12px;overflow:hidden;background:#000}
  .yt-player{width:100%;height:100%;border:none}
  .yt-thumb-busca{text-decoration:none}

  /* ── cancao e trecho ── */
  .cancao-letra{white-space:pre-line;font:italic 15px/1.7 Literata,Georgia,serif;color:var(--tinta)}
  .musica-trecho{padding:10px 14px;background:color-mix(in srgb,var(--acento) 5%,transparent);border-radius:10px;margin-top:8px}
  .musica-trecho .original{font:14px/1.6 Literata,Georgia,serif}
  .musica-trecho .traducao-trecho{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:4px}

  /* ── estudio musical ── */
  .grade-musicas{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .cartao-musica{display:flex;flex-direction:column;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .cartao-musica:hover{border-color:var(--acento);box-shadow:0 2px 12px color-mix(in srgb,var(--acento) 10%,transparent)}
  .thumb-musica{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--linha)}
  .thumb-musica.placeholder{display:flex;align-items:center;justify-content:center;font-size:40px;background:color-mix(in srgb,var(--acento) 8%,var(--papel2))}
  .info-musica{padding:12px 14px}
  .titulo-musica{font:500 15px Literata,Georgia,serif;color:var(--tinta)}
  .artista-musica{font-size:12.5px;color:var(--tinta2);margin-top:2px}
  .unidade-musica{font-size:11px;color:var(--tinta2);margin-top:6px;padding:2px 8px;background:color-mix(in srgb,var(--acento) 8%,transparent);border-radius:4px;display:inline-block}

  /* ── estudo de musica (estrofe por estrofe) ── */
  .voltar-estudio{background:none;border:none;font:inherit;font-size:13px;color:var(--tinta2);cursor:pointer;padding:0;margin-bottom:10px}
  .voltar-estudio:hover{color:var(--acento)}
  .estudo-musica-header{text-align:center}
  .estudo-musica-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0}

  .estudo-estrofes h2{font:600 18px Literata,Georgia,serif;color:var(--tinta)}
  .lista-estrofes{display:flex;flex-direction:column;gap:0}
  .estrofe-item{padding:0;border-bottom:1px solid var(--linha);transition:background .15s}
  .estrofe-item:last-child{border-bottom:none}
  .estrofe-item.aberta{background:color-mix(in srgb,var(--acento) 6%,transparent);border-radius:10px;margin:4px 0}
  .estrofe-cabecalho{display:flex;flex-direction:column;gap:6px;padding:14px 16px;cursor:pointer}
  .estrofe-cabecalho:hover{background:color-mix(in srgb,var(--acento) 4%,transparent)}
  .estrofe-num{font:600 12px/1 sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--acento)}
  .estrofe-original{display:flex;align-items:flex-start;gap:10px;font:500 15px/1.6 Literata,Georgia,serif;color:var(--tinta)}
  .estrofe-original span{white-space:pre-line}
  .estrofe-detalhe{padding:4px 16px 16px 16px}
  .estrofe-trad{font-size:14px;color:var(--tinta2);font-style:italic;margin-bottom:12px;padding:10px 14px;background:color-mix(in srgb,var(--acento) 5%,transparent);border-radius:8px;line-height:1.6}
  .estrofe-vocab{margin-bottom:10px}
  .estrofe-vocab h4{margin:0 0 10px;font:600 13px sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta2)}
  .vocab-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--linha) 60%,transparent)}
  .vocab-item:first-child{border-top:none}
  .vocab-info{flex:1;min-width:0}
  .vocab-palavra{font:500 15px Literata,Georgia,serif;color:var(--acento)}
  .vocab-sig{font-size:13.5px;color:var(--tinta);margin-top:2px}
  .vocab-detalhe{font-size:12.5px;color:var(--tinta2);margin-top:2px;line-height:1.5}
  .vocab-sin{font-size:12px;color:var(--tinta2);font-style:italic;margin-top:2px}
  .estrofe-pron{font-size:13px;color:var(--tinta2);padding:10px 14px;background:color-mix(in srgb,var(--ouro) 8%,transparent);border-radius:8px;line-height:1.6;margin-top:4px}

  /* ── tradutor ── */
  .busca-dicionario{width:100%;padding:14px 18px;border:2px solid var(--linha);border-radius:12px;font:inherit;font-size:16px;background:var(--papel);color:var(--tinta);transition:border-color .15s}
  .busca-dicionario:focus{border-color:var(--acento);outline:none}
  .tradutor-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .tradutor-local{margin-top:0}
  .tradutor-local h4{font:600 13px sans-serif;text-transform:uppercase;letter-spacing:.3px;color:var(--tinta2)}
  .resultados-busca{display:flex;flex-direction:column;gap:12px}
  .resultado-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--papel2);border:1px solid var(--linha);border-radius:10px}
  .resultado-item+.resultado-item{margin-top:0}
  .unid-tag{display:inline-block;font-size:10px;color:var(--tinta2);padding:1px 6px;background:color-mix(in srgb,var(--acento) 8%,transparent);border-radius:3px;margin-top:4px}

  /* ── quiz ── */
  .quiz-bloco .sub{max-width:none}
  .quiz-pergunta{font:500 17px/1.5 Literata,Georgia,serif;margin-bottom:14px}
  .opcoes{display:flex;flex-direction:column;gap:8px}
  .opcao{text-align:left;padding:13px 16px;border:2px solid var(--linha);border-radius:10px;background:var(--papel);font:inherit;font-size:14.5px;cursor:pointer;color:var(--tinta);transition:border-color .15s,background .15s}
  .opcao:hover{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 4%,transparent)}
  .opcao.certa{border-color:var(--bom);background:color-mix(in srgb,var(--bom) 12%,var(--papel))}
  .opcao.errada{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 12%,var(--papel))}
  .opcao:disabled{cursor:default}
  .quiz-resultado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 0}
  .quiz-resultado-nota{font:600 48px Literata,Georgia,serif;color:var(--acento)}
  .quiz-resultado-txt{font-size:16px;color:var(--tinta)}
