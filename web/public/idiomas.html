<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idiomas — Fiolib</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<link rel="stylesheet" href="/fio-paginas.css">
<link rel="stylesheet" href="/fio-temas.css">
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
<style>
  main{max-width:1080px}

  /* ── grade de idiomas (hub) ── */
  .topo-idiomas{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .hub-topo{padding:28px 30px;background:
      linear-gradient(135deg,color-mix(in srgb,var(--acento) 7%,var(--papel2)),var(--papel2)),
      repeating-linear-gradient(115deg,transparent 0 120px,color-mix(in srgb,var(--tinta) 2%,transparent) 120px 121px);
    border:1px solid var(--linha);border-radius:18px;margin-bottom:22px;position:relative;overflow:hidden}
  .hub-topo::after{content:"🇫🇷 🇪🇸 🇯🇵 🇩🇪 🇷🇺 🇮🇹 🇬🇧";position:absolute;right:-10px;bottom:-18px;font-size:52px;opacity:.08;letter-spacing:6px;pointer-events:none}
  .hub-topo h1{font-size:34px;margin:0 0 6px}
  .selo-tear{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ouro) 16%,transparent);color:var(--ouro);border:1px solid color-mix(in srgb,var(--ouro) 45%,var(--linha));border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;flex:none}
  .hub-busca-rapida{width:100%;padding:13px 18px;border:2px solid var(--linha);border-radius:12px;font:inherit;font-size:14.5px;background:var(--papel2);color:var(--tinta);margin-bottom:20px;transition:border-color .15s}
  .hub-busca-rapida:focus{border-color:var(--acento);outline:none}
  .hub-stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;padding:14px 20px;background:var(--papel2);border:1px solid var(--linha);border-radius:12px}
  .hub-stat{display:flex;flex-direction:column}
  .hub-stat b{font:600 22px Literata,Georgia,serif;color:var(--acento)}
  .hub-stat span{font-size:11px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.4px}
  .grade-idiomas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .cartao-idioma{background:var(--papel2);border:1px solid var(--linha);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .2s,transform .2s;position:relative}
  .cartao-idioma:hover{border-color:var(--acento);box-shadow:0 8px 22px color-mix(in srgb,var(--acento) 18%,transparent);transform:translateY(-3px)}
  .cartao-idioma[disabled]{opacity:.55;cursor:default}
  .cartao-idioma .bandeira{font-size:34px;line-height:1}
  .cartao-idioma h3{margin:0;font:500 19px Literata,Georgia,serif;text-transform:none;letter-spacing:0;color:var(--tinta)}
  .cartao-idioma .prof{font-size:12px;color:var(--tinta2)}
  .selo-andamento{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--bom);background:color-mix(in srgb,var(--bom) 14%,transparent);padding:3px 8px;border-radius:999px}
  .cartao-progresso{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .cartao-progresso-barra{height:5px;border-radius:3px;background:var(--linha);overflow:hidden}
  .cartao-progresso-barra i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--ouro));border-radius:3px}
  .cartao-progresso span{font-size:11px;color:var(--tinta2)}
  .hub-separador{display:flex;align-items:center;gap:14px;margin:34px 0 8px;color:var(--tinta2);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .hub-separador::before,.hub-separador::after{content:"";flex:1;height:1px;background:var(--linha)}
  .hub-ferramentas{margin-top:14px}
  .hub-ferramentas h2{font:600 20px Literata,Georgia,serif;margin:0 0 2px}
  .escolher-ferramenta{text-align:center;padding:20px 0 8px}
  .escolher-ferramenta h1{font-size:26px}
  .escolher-ferramenta .grade-idiomas{max-width:640px;margin:22px auto 0}
  .escolher-ferramenta .cartao-idioma{align-items:center;text-align:center}

  /* ── continuar estudando ── */
  .continuar-estudando{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .continuar-card{flex:1;min-width:260px;background:linear-gradient(135deg,color-mix(in srgb,var(--acento) 10%,var(--papel2)),var(--papel2));border:1px solid color-mix(in srgb,var(--acento) 25%,var(--linha));border-radius:16px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .continuar-rotulo{display:block;font-size:11px;color:var(--acento);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
  .continuar-txt h2{margin:0 0 8px;font:600 20px Literata,Georgia,serif}
  .destaque-musica{flex:1;min-width:240px;max-width:320px;display:flex;gap:12px;align-items:center;background:var(--papel2);border:1px solid var(--linha);border-radius:16px;padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s}
  .destaque-musica:hover{border-color:var(--acento)}
  .destaque-musica img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none}
  .destaque-musica-txt{display:flex;flex-direction:column;font-size:12.5px;color:var(--tinta2)}
  .destaque-musica-txt span{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--acento);font-weight:600;margin-bottom:2px}
  .destaque-musica-txt b{font:500 14.5px Literata,Georgia,serif;color:var(--tinta)}

  /* ── topo do idioma (hero) ── */
  .topo-idioma{margin-bottom:0}
  .voltar-link{font-size:13px;color:var(--tinta2);text-decoration:none}
  .voltar-link:hover{color:var(--acento)}
  .idioma-hero{display:flex;align-items:center;gap:16px;margin-top:8px}
  .idioma-bandeira{font-size:52px;line-height:1}
  .idioma-hero h1{font:600 28px Literata,Georgia,serif;color:var(--tinta)}
  .saudacao-nativa{margin:4px 0 0;font:italic 14px/1.5 Literata,Georgia,serif;color:var(--tinta2)}
  .trocador-idioma{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--papel2);color:var(--tinta);cursor:pointer;flex:none;align-self:center}

  /* ── navegacao por secoes ── */
  .secao-nav{display:flex;gap:0;border-bottom:2px solid var(--linha);margin:18px 0 24px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .secao-nav::-webkit-scrollbar,.abas::-webkit-scrollbar,.unidades-tabs::-webkit-scrollbar{display:none}
  .secao-btn{padding:12px 18px;border:none;background:none;font:inherit;font-size:14px;color:var(--tinta2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
  .secao-btn:hover{color:var(--tinta)}
  .secao-btn.ativa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  .secao-conteudo{display:flex;flex-direction:column;gap:20px}

  /* ── painel principal (dashboard) ── */
  .painel-topo{display:flex;align-items:center;gap:22px;background:var(--papel2);border:1px solid var(--linha);border-radius:16px;padding:22px 24px;margin-bottom:16px;flex-wrap:wrap}
  .anel-progresso{--pct:0%;flex:none;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--acento) var(--pct),color-mix(in srgb,var(--linha) 70%,transparent) 0);display:flex;align-items:center;justify-content:center}
  .anel-progresso::before{content:"";position:absolute}
  .anel-miolo{width:68px;height:68px;border-radius:50%;background:var(--papel2);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .anel-miolo b{font:600 20px Literata,Georgia,serif;color:var(--tinta)}
  .anel-miolo span{font-size:9.5px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.4px}
  .painel-topo-txt{flex:1;min-width:200px}
  .painel-topo-txt h2{margin:0 0 4px;font:600 19px Literata,Georgia,serif}
  .painel-topo-txt p{margin:0;font-size:13px;color:var(--tinta2)}
  .painel-selos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .selo-nivel,.selo-sequencia{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .selo-nivel{background:color-mix(in srgb,var(--acento) 12%,transparent);color:var(--acento);border:1px solid color-mix(in srgb,var(--acento) 30%,var(--linha))}
  .selo-sequencia{background:color-mix(in srgb,#ff7a1a 14%,transparent);color:#c9591b;border:1px solid color-mix(in srgb,#ff7a1a 30%,var(--linha))}
  .painel-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:14px;margin-bottom:8px}
  .stat{background:var(--papel2);border:1px solid var(--linha);border-radius:12px;padding:18px 16px;text-align:center}
  .stat-clicavel{font:inherit;cursor:pointer;transition:border-color .15s}
  .stat-clicavel:hover{border-color:var(--acento)}
  .stat-num{font:600 28px Literata,Georgia,serif;color:var(--acento)}
  .stat-label{font-size:12px;color:var(--tinta2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  .painel-acoes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .painel-secoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .painel-card{display:flex;align-items:flex-start;gap:14px;padding:18px;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
  .painel-card:hover{border-color:var(--acento);box-shadow:0 2px 12px color-mix(in srgb,var(--acento) 10%,transparent)}
  .painel-card-capa{position:absolute;inset:0;object-fit:cover;opacity:.12;filter:saturate(0)}
  .painel-card-ico{font-size:28px;flex:none;z-index:1}
  .painel-card h3{margin:0 0 2px;font:500 16px Literata,Georgia,serif;z-index:1}
  .painel-card p{margin:0;font-size:12.5px;color:var(--tinta2);z-index:1}
  .painel-atividade{display:flex;flex-direction:column;gap:0}
  .painel-atividade h3{margin:0 0 10px;font:600 15px Literata,Georgia,serif}
  .atividade-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linha);font-size:13.5px}
  .atividade-item:first-child{border-top:none}
  .atividade-ico{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:color-mix(in srgb,var(--bom) 14%,transparent);color:var(--bom)}
  .atividade-txt{flex:1;color:var(--tinta)}
  .atividade-quando{font-size:11.5px;color:var(--tinta2);white-space:nowrap}

  /* ── unidades em abas horizontais ── */
  .unidades-tabs-wrap{position:relative;display:flex;align-items:center;gap:4px;margin-bottom:8px}
  .unidades-tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 0 14px;scrollbar-width:none;scroll-behavior:smooth}
  .unidades-seta{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--linha);background:var(--papel2);color:var(--acento);font-size:17px;line-height:1;cursor:pointer;transition:opacity .15s,border-color .15s}
  .unidades-seta:hover{border-color:var(--acento)}
  .unidades-seta.escondida{opacity:0;pointer-events:none}
  .unidade-tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--linha);border-radius:10px;background:var(--papel2);font:inherit;font-size:13px;color:var(--tinta2);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
  .unidade-tab:hover{border-color:var(--acento);color:var(--tinta)}
  .unidade-tab.ativa{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 10%,var(--papel2));color:var(--acento);font-weight:600}
  .unidade-tab.feita{border-color:color-mix(in srgb,var(--bom) 40%,var(--linha))}
  .unidade-tab.feita .tab-num{color:var(--bom)}
  .tab-num{font-weight:700;font-size:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--acento) 10%,transparent)}
  .unidade-tab.ativa .tab-num{background:color-mix(in srgb,var(--acento) 20%,transparent);color:var(--acento)}
  .tab-titulo{max-width:140px;overflow:hidden;text-overflow:ellipsis}

  /* ── abas ── */
  .abas{display:flex;gap:0;border-bottom:2px solid var(--linha);margin-bottom:20px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .aba{padding:11px 18px;border:none;background:none;font:inherit;font-size:13.5px;color:var(--tinta2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
  .aba:hover{color:var(--tinta)}
  .aba.ativa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  .conteudo-aba{display:none;flex-direction:column;gap:22px}
  .conteudo-aba.visivel{display:flex}

  /* ── blocos ── */
  .licao{display:flex;flex-direction:column;gap:0}
  .bloco{background:var(--caixa,var(--papel2));border:1px solid var(--linha);border-radius:14px;padding:18px 20px}
  .bloco h2{margin-top:0}
  .bloco-titulo{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .bloco-titulo .ico{font-size:18px}
  .nivel-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--acento);text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;background:color-mix(in srgb,var(--acento) 10%,transparent);border-radius:4px;margin-top:6px}

  /* ── notas pessoais ── */
  .nota-pessoal .bloco-titulo{justify-content:space-between}
  .nota-status{font-size:11px;color:var(--bom);margin-left:auto}
  .nota-pessoal-campo{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;font:inherit;font-size:13.5px;background:var(--papel);color:var(--tinta);resize:vertical;margin-top:8px}
  .nota-pessoal-campo:focus{border-color:var(--acento);outline:none}
  .nota-pessoal-compacta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--linha)}
  .nota-pessoal-titulo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tinta2);margin-bottom:6px}
  .nota-pessoal-compacta .nota-pessoal-campo{font-size:13px;padding:8px 10px}

  /* ── vocabulario ── */
  .vocab{display:flex;flex-direction:column;gap:10px}
  .palavra{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
  .palavra:first-child{border-top:none}
  .palavra .fala,.fala.mini{flex:none;background:none;border:1px solid var(--linha);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--acento);transition:border-color .15s;display:inline-flex;align-items:center;justify-content:center}
  .fala.mini{width:28px;height:28px;font-size:13px}
  .fala.card-fala{position:absolute;top:12px;right:12px;z-index:1}
  .palavra .fala:hover,.fala.mini:hover{border-color:var(--acento)}
  .palavra .txt{flex:1;min-width:0}
  .palavra .orig,.resultado-item .orig{font:500 16px Literata,Georgia,serif}
  .palavra .trad,.resultado-item .trad{color:var(--tinta2);font-size:13.5px}
  .palavra .exemplo,.resultado-item .exemplo{margin-top:4px;font-size:13px;color:var(--tinta2);font-style:italic}

  /* ── gramatica ── */
  .gramatica{line-height:1.7;font-size:14.5px}
  .gramatica-regra{font:500 15px/1.5 Literata,Georgia,serif;margin-bottom:10px}
  .gramatica-explicacao{margin-bottom:12px}
  .gramatica-exemplos{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:color-mix(in srgb,var(--acento) 6%,transparent);border-radius:10px}
  .gramatica-ex{display:flex;flex-direction:column;gap:2px}
  .gramatica-ex .frase{font:italic 14.5px Literata,Georgia,serif}
  .gramatica-ex .trad{font-size:12.5px;color:var(--tinta2)}

  /* ── dialogo ── */
  .dialogo{display:flex;flex-direction:column;gap:10px;padding:4px 0}
  .dialogo-situacao{font-size:13px;color:var(--tinta2);font-style:italic;margin-bottom:6px}
  .fala-linha{display:flex;gap:10px;align-items:flex-start}
  .fala-linha.dir{flex-direction:row-reverse}
  .fala-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .fala-avatar.a{background:color-mix(in srgb,var(--acento) 18%,var(--papel));color:var(--acento)}
  .fala-avatar.b{background:color-mix(in srgb,var(--ouro) 18%,var(--papel));color:var(--ouro)}
  .fala-bolha{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
  .fala-bolha.a{background:color-mix(in srgb,var(--acento) 10%,var(--papel));border-bottom-left-radius:4px}
  .fala-bolha.b{background:color-mix(in srgb,var(--ouro) 10%,var(--papel));border-bottom-right-radius:4px}
  .fala-trad{font-size:12px;color:var(--tinta2);font-style:italic;margin-top:3px;cursor:pointer;user-select:none}

  /* ── expressoes ── */
  .expressoes{display:flex;flex-direction:column;gap:2px}
  .expressao-item{padding:10px 0;border-top:1px solid var(--linha)}
  .expressao-item:first-child{border-top:none}
  .expressao-frase{font:500 15px Literata,Georgia,serif}
  .expressao-sig{font-size:13px;color:var(--tinta2);margin-top:3px}
  .expressao-uso{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:2px}

  /* ── cultura ── */
  .cultura-nota{padding:14px 16px;background:color-mix(in srgb,var(--acento) 7%,transparent);border-left:3px solid var(--acento);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.7}

  /* ── associacao e dica ── */
  .assoc{padding:12px 14px;background:color-mix(in srgb,var(--ouro) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}
  .assoc b{color:var(--ouro)}
  .dica{padding:12px 14px;background:color-mix(in srgb,var(--bom) 10%,transparent);border-radius:10px;font-size:13.5px;line-height:1.6}

  /* ── flashcards ── */
  .flashcards-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
  .flashcard-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
  .flashcard-progresso{display:flex;align-items:center;gap:12px;width:100%;max-width:420px}
  .progresso-txt{font-size:13px;color:var(--tinta2);white-space:nowrap}
  .flashcard-barra{flex:1;height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
  .flashcard-barra i{display:block;height:100%;background:var(--acento);border-radius:3px;transition:width .3s}
  .flashcard-container{width:100%;display:flex;justify-content:center}
  .flashcard{width:100%;max-width:420px;min-height:240px;perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flashcard-inner{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
  .flashcard.virada .flashcard-inner{transform:rotateY(180deg)}
  .flashcard-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border-radius:18px;border:2px solid var(--linha);text-align:center;box-shadow:0 4px 20px color-mix(in srgb,var(--tinta) 6%,transparent)}
  .flashcard-frente{background:var(--papel2)}
  .flashcard-verso{transform:rotateY(180deg);background:color-mix(in srgb,var(--bom) 8%,var(--papel2));border-color:color-mix(in srgb,var(--bom) 40%,var(--linha))}
  .flashcard-palavra{font:500 28px Literata,Georgia,serif}
  .flashcard-instrucao{font-size:12px;color:var(--tinta2);margin-top:12px;opacity:.7}
  .flashcard-traducao{font:500 24px Literata,Georgia,serif;color:var(--bom)}
  .flashcard-exemplo{font-size:13px;color:var(--tinta2);margin-top:10px;font-style:italic}
  .flashcard-acoes{display:flex;gap:14px;margin-top:8px}
  .flashcard-acoes button{padding:12px 30px;border-radius:10px;border:2px solid var(--linha);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s}
  .flashcard-acoes button:active{transform:scale(.96)}
  .flashcard-acoes .nao-sei{background:color-mix(in srgb,var(--acento) 10%,var(--papel));color:var(--acento);border-color:color-mix(in srgb,var(--acento) 30%,var(--linha))}
  .flashcard-acoes .nao-sei:hover{background:color-mix(in srgb,var(--acento) 18%,var(--papel))}
  .flashcard-acoes .sei{background:color-mix(in srgb,var(--bom) 10%,var(--papel));color:var(--bom);border-color:color-mix(in srgb,var(--bom) 30%,var(--linha))}
  .flashcard-acoes .sei:hover{background:color-mix(in srgb,var(--bom) 18%,var(--papel))}
  .flashcard-resumo{text-align:center;padding:30px 20px}
  .flashcard-resumo .nota{font:500 52px Literata,Georgia,serif;color:var(--acento);margin-bottom:6px}
  .flashcard-resumo .resumo-txt{font-size:16px;color:var(--tinta);margin-bottom:6px}
  .flashcard-resumo .resumo-msg{font-size:13.5px;color:var(--tinta2);line-height:1.5}
  .flashcard-embaralhar{background:none;border:1px solid var(--linha);border-radius:8px;padding:6px 14px;font:inherit;font-size:12.5px;color:var(--tinta2);cursor:pointer}
  .flashcard-embaralhar:hover{border-color:var(--acento);color:var(--acento)}

  /* ── youtube thumbnail e player ── */
  .yt-thumb{display:block;position:relative;width:100%;max-width:560px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;text-decoration:none}
  .yt-thumb img{width:100%;height:100%;object-fit:cover}
  .yt-thumb .yt-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;background:rgba(0,0,0,.25);transition:background .2s}
  .yt-thumb:hover .yt-play{background:rgba(0,0,0,.45)}
  .yt-player-wrap{width:100%;max-width:560px;aspect-ratio:16/9;margin:12px auto 0;border-radius:12px;overflow:hidden;background:#000}
  .yt-player{width:100%;height:100%;border:none}
  .yt-thumb-busca{text-decoration:none}

  /* ── cancao e trecho ── */
  .cancao-letra{white-space:pre-line;font:italic 15px/1.7 Literata,Georgia,serif;color:var(--tinta)}
  .musica-trecho{padding:10px 14px;background:color-mix(in srgb,var(--acento) 5%,transparent);border-radius:10px;margin-top:8px}
  .musica-trecho .original{font:14px/1.6 Literata,Georgia,serif}
  .musica-trecho .traducao-trecho{font-size:12.5px;color:var(--tinta2);font-style:italic;margin-top:4px}

  /* ── estudio musical ── */
  .pedir-musica-form{margin-top:12px}
  .pedir-musica-campos{display:flex;flex-direction:column;gap:10px;max-width:440px}
  .pedir-musica-campos input{padding:11px 14px;border:2px solid var(--linha);border-radius:10px;font:inherit;font-size:14px;background:var(--papel);color:var(--tinta)}
  .pedir-musica-campos input:focus{border-color:var(--acento);outline:none}
  .grade-musicas{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .cartao-musica{display:flex;flex-direction:column;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .2s}
  .cartao-musica:hover{border-color:var(--acento);box-shadow:0 6px 20px color-mix(in srgb,var(--acento) 16%,transparent);transform:translateY(-2px)}
  .cartao-musica:hover .titulo-musica{color:var(--acento)}
  .thumb-musica{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--linha);transition:transform .35s}
  .cartao-musica:hover .thumb-musica{transform:scale(1.07)}
  .thumb-musica.placeholder{display:flex;align-items:center;justify-content:center;font-size:40px;background:color-mix(in srgb,var(--acento) 8%,var(--papel2))}
  .info-musica{padding:12px 14px}
  .titulo-musica{font:500 15px Literata,Georgia,serif;color:var(--tinta);transition:color .15s}
  .artista-musica{font-size:12.5px;color:var(--tinta2);margin-top:2px}
  .unidade-musica{font-size:11px;color:var(--tinta2);margin-top:6px;padding:2px 8px;background:color-mix(in srgb,var(--acento) 8%,transparent);border-radius:4px;display:inline-block}

  /* ── estudo de musica (estrofe por estrofe) ── */
  .voltar-estudio{background:none;border:none;font:inherit;font-size:13px;color:var(--tinta2);cursor:pointer;padding:0;margin-bottom:10px}
  .voltar-estudio:hover{color:var(--acento)}
  .estudo-musica-header{text-align:center;position:relative;overflow:hidden}
  .estudo-musica-header::before{content:"";position:absolute;inset:0;background:var(--capa) center/cover;filter:blur(28px) brightness(.5) saturate(1.3);transform:scale(1.15);z-index:0;opacity:.55}
  .estudo-musica-header>*{position:relative;z-index:1}
  .estudo-musica-header h2{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);font-size:26px}
  .estudo-musica-header .sub{color:rgba(255,255,255,.85)}
  .estudo-musica-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
  .velocidade-btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .velocidade-btns button.ativa{border-color:var(--acento);color:var(--acento);font-weight:600}

  /* ── legenda ao vivo ── */
  .legenda-ao-vivo{background:#111;border-radius:14px;padding:20px 24px;text-align:center;position:relative;border:1px solid color-mix(in srgb,var(--acento) 30%,transparent)}
  .legenda-rotulo{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:1px;color:#ff4444;font-weight:700}
  .legenda-rotulo::before{content:"● "}
  .legenda-original{font:500 20px/1.5 Literata,Georgia,serif;color:#fff;min-height:30px}
  .legenda-traducao{font-size:14px;color:rgba(255,255,255,.6);font-style:italic;margin-top:6px;min-height:18px}

  /* ── modo adivinha ── */
  .modo-adivinha{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tinta2);cursor:pointer}
  .revelar-linha{display:none;margin-top:6px;margin-left:42px;font-size:11.5px;color:var(--acento);background:none;border:1px solid color-mix(in srgb,var(--acento) 40%,var(--linha));border-radius:6px;padding:3px 9px;cursor:pointer}
  .adivinha-ativo .linha-item:not(.revelada) .linha-trad,
  .adivinha-ativo .linha-item:not(.revelada) .linha-notas{display:none}
  .adivinha-ativo .linha-item:not(.revelada) .revelar-linha{display:inline-block}
  .loop-btn.ativa{color:var(--acento);border-color:var(--acento);animation:loop-pulso 1.4s ease-in-out infinite}
  @keyframes loop-pulso{0%,100%{opacity:1}50%{opacity:.5}}

  .estudo-estrofes h2{font:600 18px Literata,Georgia,serif;color:var(--tinta)}
  .lista-estrofes{display:flex;flex-direction:column;gap:0}
  .estrofe-item{padding:0;border-bottom:1px solid var(--linha);transition:background .15s}
  .estrofe-item:last-child{border-bottom:none}
  .estrofe-item.aberta{background:color-mix(in srgb,var(--acento) 6%,transparent);border-radius:10px;margin:4px 0}
  .estrofe-cabecalho{display:flex;flex-direction:column;gap:6px;padding:14px 16px;cursor:pointer}
  .estrofe-cabecalho:hover{background:color-mix(in srgb,var(--acento) 4%,transparent)}
  .estrofe-num{font:600 12px/1 sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--acento)}
  .estrofe-original{display:flex;align-items:flex-start;gap:10px;font:500 15px/1.6 Literata,Georgia,serif;color:var(--tinta)}
  .estrofe-original span{white-space:pre-line}
  .estrofe-detalhe{padding:4px 16px 16px 16px}
  .estrofe-trad{font-size:14px;color:var(--tinta2);font-style:italic;margin-bottom:12px;padding:10px 14px;background:color-mix(in srgb,var(--acento) 5%,transparent);border-radius:8px;line-height:1.6}
  .estrofe-vocab{margin-bottom:10px}
  .estrofe-vocab h4{margin:0 0 10px;font:600 13px sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta2)}
  .vocab-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--linha) 60%,transparent)}
  .vocab-item:first-child{border-top:none}
  .vocab-info{flex:1;min-width:0}
  .vocab-palavra{font:500 15px Literata,Georgia,serif;color:var(--acento)}
  .vocab-sig{font-size:13.5px;color:var(--tinta);margin-top:2px}
  .vocab-detalhe{font-size:12.5px;color:var(--tinta2);margin-top:2px;line-height:1.5}
  .vocab-sin{font-size:12px;color:var(--tinta2);font-style:italic;margin-top:2px}
  .estrofe-pron{font-size:13px;color:var(--tinta2);padding:10px 14px;background:color-mix(in srgb,var(--ouro) 8%,transparent);border-radius:8px;line-height:1.6;margin-top:4px}

  /* ── linha por linha (estúdio musical) ── */
  .estrofe-linhas{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
  .estrofe-linhas h4{margin:0 0 10px;font:600 13px sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta2)}
  .linha-item{padding:12px 14px;border-radius:10px;border-left:3px solid color-mix(in srgb,var(--acento) 35%,var(--linha));transition:background .3s,border-color .3s}
  .linha-item:nth-child(even){background:color-mix(in srgb,var(--acento) 4%,transparent)}
  .linha-item.linha-tocando{background:color-mix(in srgb,var(--acento) 14%,transparent);border-left-color:var(--acento);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acento) 30%,transparent)}
  .linha-original{display:flex;align-items:flex-start;gap:8px;font:500 15px/1.5 Literata,Georgia,serif;color:var(--tinta)}
  .linha-trad{font-size:13.5px;color:var(--tinta2);font-style:italic;margin:4px 0 0 42px}
  .linha-notas{margin:8px 0 0 42px;display:flex;flex-direction:column;gap:5px}
  .linha-nota{font-size:12.5px;color:var(--tinta2);line-height:1.55;padding:6px 10px;background:color-mix(in srgb,var(--ouro) 7%,transparent);border-radius:6px}
  .linha-nota b{color:var(--acento);font-weight:600}
  @media(max-width:520px){.linha-trad,.linha-notas{margin-left:0}}

  /* ── tradutor: ficha de palavra ── */
  .ficha-tradutor{background:var(--papel2);border:1px solid var(--linha);border-radius:16px;padding:22px 24px;position:relative;overflow:hidden}
  .ficha-tradutor::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acento),color-mix(in srgb,var(--ouro) 70%,var(--acento)))}
  .tradutor-direcao{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
  .tradutor-lado{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--tinta2);min-width:76px;text-align:center;text-transform:uppercase;letter-spacing:.4px;opacity:.5;transition:opacity .15s}
  .tradutor-lado.ativo{color:var(--acento);opacity:1}
  .tradutor-lado-bandeira{font-size:26px}
  .tradutor-swap{background:var(--papel);border:1px solid var(--linha);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;color:var(--acento);transition:border-color .15s,transform .2s;flex:none}
  .tradutor-swap:hover{border-color:var(--acento)}
  .tradutor-swap.girou{transform:rotate(180deg)}
  .busca-dicionario{width:100%;padding:14px 18px;border:2px solid var(--linha);border-radius:12px;font:italic 17px/1.4 Literata,Georgia,serif;background:var(--papel);color:var(--tinta);transition:border-color .15s}
  .busca-dicionario:focus{border-color:var(--acento);outline:none}
  .tradutor-resultado{display:flex;align-items:center;gap:16px;padding:20px 4px 4px;margin-top:18px;border-top:1px solid var(--linha)}
  .tradutor-resultado .fala{width:42px;height:42px;font-size:17px}
  .tradutor-resultado-txt{flex:1;font:600 26px/1.3 Literata,Georgia,serif;color:var(--tinta)}
  .tradutor-resultado .estrela{width:38px;height:38px;font-size:19px;color:var(--tinta2);border-color:var(--linha)}
  .tradutor-resultado .estrela.salva{color:var(--ouro);border-color:color-mix(in srgb,var(--ouro) 40%,var(--linha))}
  .tradutor-carregando .tradutor-resultado-txt{color:var(--tinta2);font-style:italic;font-size:16px;font-weight:400;position:relative;overflow:hidden}
  .tradutor-motor{font-size:11px;color:var(--tinta2);margin-top:6px;text-align:right}
  .tradutor-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .tradutor-local{margin-top:16px}
  .tradutor-local h4{font:600 12.5px sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta2);margin:0 0 12px;display:flex;align-items:center;gap:6px}
  .tradutor-local h4::before{content:"📖"}
  .resultados-busca{display:flex;flex-direction:column;gap:10px}
  .resultado-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--papel2);border:1px solid var(--linha);border-radius:12px;transition:border-color .15s}
  .resultado-item:hover{border-color:color-mix(in srgb,var(--acento) 40%,var(--linha))}
  .resultado-item+.resultado-item{margin-top:0}
  .unid-tag{display:inline-block;font-size:10px;color:var(--tinta2);padding:1px 6px;background:color-mix(in srgb,var(--acento) 8%,transparent);border-radius:3px;margin-top:6px}

  /* ── quiz ── */
  .quiz-bloco .sub{max-width:none}
  .quiz-pergunta{font:500 17px/1.5 Literata,Georgia,serif;margin-bottom:14px}
  .opcoes{display:flex;flex-direction:column;gap:8px}
  .opcao{text-align:left;padding:13px 16px;border:2px solid var(--linha);border-radius:10px;background:var(--papel);font:inherit;font-size:14.5px;cursor:pointer;color:var(--tinta);transition:border-color .15s,background .15s}
  .opcao:hover{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 4%,transparent)}
  .opcao.certa{border-color:var(--bom);background:color-mix(in srgb,var(--bom) 12%,var(--papel))}
  .opcao.errada{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 12%,var(--papel))}
  .opcao:disabled{cursor:default}
  .quiz-resultado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 0}
  .quiz-resultado-nota{font:600 48px Literata,Georgia,serif;color:var(--acento)}
  .quiz-resultado-txt{font-size:16px;color:var(--tinta)}
  .quiz-resultado-msg{font-size:14px;color:var(--tinta2)}
  .quiz-placar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--papel2);border-radius:10px;margin-bottom:14px;font-size:13.5px}
  .quiz-progresso-bar{flex:1;min-width:100px;height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
  .quiz-progresso-fill{height:100%;background:var(--acento);border-radius:3px;transition:width .3s}
  .quiz-status{color:var(--tinta2)}
  .quiz-acertos-wrap{white-space:nowrap}
  .quiz-placar .acertos{font:600 18px Literata,Georgia,serif;color:var(--bom)}
  .quiz-corpo{min-height:120px}
  .campo-resposta{display:flex;gap:8px;flex-wrap:wrap}
  .campo-resposta input{flex:1;min-width:180px}
  .quiz-input{padding:11px 14px;border:2px solid var(--linha);border-radius:10px;font:inherit;font-size:15px;background:var(--papel);color:var(--tinta)}
  .quiz-input:focus{border-color:var(--acento);outline:none}

  /* ── bloqueio ── */
  .bloqueio{text-align:center;padding:50px 20px}
  .bloqueio .bandeiras{font-size:40px;letter-spacing:8px;margin-bottom:6px}

  @media(max-width:760px){
    .fala-bolha{max-width:88%}
    .flashcard{max-width:100%}
    .abas{gap:0}
    .aba{padding:10px 14px;font-size:13px}
    .flashcard-acoes{flex-wrap:wrap;justify-content:center}
    .painel-stats{grid-template-columns:repeat(2,1fr)}
    .idioma-hero{gap:12px}
    .idioma-bandeira{font-size:40px}
    .idioma-hero h1{font-size:22px}
    .secao-nav{gap:0}
    .secao-btn{padding:10px 12px;font-size:13px}
    .grade-musicas{grid-template-columns:1fr}
    .unidades-tabs{gap:4px}
    .unidade-tab{padding:8px 12px;font-size:12px}
    .tab-titulo{max-width:100px}
    .yt-player-wrap{border-radius:8px}
  }
</style>
</head>
