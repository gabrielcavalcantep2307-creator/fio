<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrinhos, mangá e manhwa — Fiolib</title>
<link rel="icon" type="image/svg+xml" href="/fio.svg">
<style>
  @font-face{font-family:Literata;src:url(/fontes/literata-latin.woff2) format('woff2');font-display:swap}
  @font-face{font-family:Inter;src:url(/fontes/inter-latin.woff2) format('woff2');font-display:swap}
  :root{--papel:#f8f5ee;--papel2:#efe9dd;--tinta:#1f1b16;--tinta2:#6d655a;--linha:#e1d9ca;--acento:#7a2e2e;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--papel:#15130f;--papel2:#1e1b16;--tinta:#ece5d6;--tinta2:#a39a8a;--linha:#2d2922;--acento:#c46a5c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.55 Inter,system-ui,sans-serif}
  a{color:inherit}
  main{max-width:1120px;margin:0 auto;padding:30px 16px 90px}
  h1{font-family:Literata,Georgia,serif;font-weight:500;font-size:clamp(28px,4.5vw,42px);margin:0 0 8px;line-height:1.1}
  .sub{color:var(--tinta2);margin:0 0 22px;max-width:66ch}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}
  .filtro{border:1px solid var(--linha);background:transparent;color:var(--tinta);font:inherit;font-size:13.5px;padding:6px 14px;border-radius:999px;cursor:pointer}
  .filtro[aria-pressed=true]{background:var(--acento);border-color:var(--acento);color:#fff}
  .series{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr))}
  .serie{display:grid;grid-template-columns:150px 1fr;gap:18px;background:var(--papel2);border:1px solid var(--linha);border-radius:14px;padding:16px;text-decoration:none}
  .serie img,.cap img{width:100%;border-radius:4px;display:block;object-fit:cover;background:var(--linha);box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}
  .serie img{aspect-ratio:3/4}
  .serie h2{font-family:Literata,Georgia,serif;font-weight:500;font-size:22px;margin:2px 0 2px}
  .aut{color:var(--tinta2);font-size:13px}
  .selos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .selo{font-size:11.5px;border:1px solid var(--linha);border-radius:999px;padding:1px 9px;color:var(--tinta2)}
  .resumo{font-size:14px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .continuar{display:inline-block;margin-top:12px;font-size:13px;color:var(--acento)}
  .topo{display:grid;grid-template-columns:220px 1fr;gap:28px;margin-bottom:34px}
  .topo img{width:100%;border-radius:6px;box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
  .botao{display:inline-block;background:var(--acento);color:#fff;border:none;border-radius:8px;padding:11px 22px;font:inherit;text-decoration:none;cursor:pointer}
  .credito{font-size:12.5px;color:var(--tinta2);margin-top:14px;max-width:70ch}
  .caps{display:grid;gap:22px 14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cap{text-decoration:none;display:block;position:relative}
  .cap img{aspect-ratio:3/4}
  .cap .t{font-size:13.5px;line-height:1.3;margin-top:8px}
  .cap .n{font-size:11.5px;color:var(--tinta2)}
  .cap .estado{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
  .cap .barrinha{height:3px;background:var(--linha);border-radius:2px;margin-top:6px;overflow:hidden}
  .cap .barrinha i{display:block;height:100%;background:var(--acento)}
  .aviso{background:var(--papel2);border:1px solid var(--linha);border-radius:12px;padding:16px 20px;margin-top:46px;font-size:13.5px;color:var(--tinta2)}
  /* abas e filtros */
  .abas{display:flex;gap:6px;margin:4px 0 22px;border-bottom:1px solid var(--linha)}
  .abas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--tinta2);font:inherit;font-size:15px;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  .abas button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--acento)}
  /* vitrine (18/09): o desenho dos sites de leitura de quadrinhos — destaque grande,
     novidades com "há X dias", ranking numerado e grade de capas com selos */
  .destaque{position:relative;display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:26px;align-items:end;padding:26px;border-radius:18px;overflow:hidden;margin:0 0 30px;color:#f3ece2;text-decoration:none;background:#16110e;isolation:isolate}
  .destaque .fundo{position:absolute;inset:-30px;z-index:-1;background-size:cover;background-position:center;filter:blur(22px) brightness(.38) saturate(1.2);transform:scale(1.1)}
  .destaque img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;box-shadow:0 20px 40px -18px #000}
  .destaque .tag{font-size:11px;letter-spacing:.22em;color:#e3a497}
  .destaque h2{font:600 clamp(24px,4vw,38px)/1.1 Literata,Georgia,serif;margin:8px 0 8px}
  .destaque p{color:#d7cbbd;max-width:60ch;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .destaque .selo{color:#e8dccd;border-color:#ffffff33}
  @media (max-width:640px){.destaque{grid-template-columns:110px 1fr;gap:16px;padding:18px}.destaque p{-webkit-line-clamp:2}}
  .faixa{margin:0 0 32px}
  .faixa-topo{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
  .faixa-topo h2{font:500 20px Literata,Georgia,serif;margin:0}
  .faixa-topo span{font-size:12.5px;color:var(--tinta2)}
  .rolo{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .novo{flex:none;width:132px;text-decoration:none;position:relative}
  .novo img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block;background:var(--linha)}
  .novo .t{font-size:13px;line-height:1.25;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .novo .q{font-size:11.5px;color:var(--tinta2)}
  .marca{position:absolute;top:7px;left:7px;background:var(--acento);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:5px;padding:2px 7px}
  .ranking{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px 22px;counter-reset:pos}
  .ranking a{display:grid;grid-template-columns:34px 46px 1fr;gap:12px;align-items:center;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--linha)}
  .ranking a::before{counter-increment:pos;content:counter(pos);font:600 24px Literata,Georgia,serif;color:var(--acento);text-align:center}
  .ranking img{width:46px;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
  .ranking b{font-weight:500;font-size:14px;display:block}
  .ranking small{color:var(--tinta2);font-size:12px}
  .grade{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .capa-serie{text-decoration:none;position:relative;display:block}
  .capa-serie .img{position:relative;border-radius:7px;overflow:hidden;background:var(--linha);aspect-ratio:3/4;transition:transform .18s}
  .capa-serie:hover .img{transform:translateY(-3px)}
  .capa-serie img{width:100%;height:100%;object-fit:cover;display:block}
  .capa-serie .tipo{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;border-radius:5px;padding:2px 7px;text-transform:capitalize}
  .capa-serie .vols{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;border-radius:5px;padding:2px 7px}
  .capa-serie .t{font-size:14px;line-height:1.25;margin-top:8px;font-weight:500}
  .capa-serie .a{font-size:12px;color:var(--tinta2)}
  .painel-filtros{background:var(--papel2);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;margin-bottom:22px;display:flex;flex-direction:column;gap:12px}
  .linha-filtro{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .linha-filtro .rot{font-size:12px;color:var(--tinta2);min-width:54px}
  .busca{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--linha);border-radius:999px;background:var(--papel);color:var(--tinta);font:inherit}
  select.sel{padding:7px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);color:var(--tinta);font:inherit;font-size:13.5px}
  .chave{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .chave input{accent-color:var(--acento);transform:scale(1.2)}
  .grade-m{display:grid;gap:22px 14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .card{background:none;border:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
  .card .cap{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:var(--papel2);box-shadow:0 10px 24px -14px rgba(0,0,0,.6);transition:transform .2s}
  .card:hover .cap{transform:translateY(-3px)}
  .card .cap img{width:100%;height:100%;object-fit:cover;display:block}
  .card .selos-c{position:absolute;left:6px;bottom:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px}
  .card .selos-c span{background:rgba(0,0,0,.74);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 7px}
  .card .selos-c .pt{background:#1d7a46}
  /* 18/09: o cartão dos sites de leitura — tipo no canto, nota, capítulos e posição */
  .card .tipo-m{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:5px;padding:2px 7px;background:#c0392b}
  .card .tipo-m.manhwa{background:#2563eb}.card .tipo-m.manhua{background:#16a34a}.card .tipo-m.one-shot{background:#7c3aed}
  .card .nota-m{position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.72);border-radius:5px;padding:2px 6px}
  .card .pos-m{position:absolute;left:-2px;bottom:-6px;font:800 44px/1 Inter,system-ui,sans-serif;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.55);text-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none}
  .card .info-m{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--tinta2);margin-top:3px}
  .card .info-m .ponto-m{width:7px;height:7px;border-radius:50%;background:#16a34a;flex:none}
  .card .info-m .ponto-m.fim{background:#94a3b8}.card .info-m .ponto-m.hiato{background:#f59e0b}
  .vitrine-m{margin:0 0 26px}
  .hero-m{position:relative;display:grid;grid-template-columns:minmax(130px,190px) 1fr;gap:24px;align-items:end;padding:26px;border-radius:18px;overflow:hidden;color:#f3ece2;background:#14100d;isolation:isolate;cursor:pointer;border:0;text-align:left;font:inherit;width:100%;margin-bottom:22px}
  .hero-m .fundo{position:absolute;inset:-30px;z-index:-1;background-size:cover;background-position:center;filter:blur(24px) brightness(.35) saturate(1.3);transform:scale(1.1)}
  .hero-m img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 20px 40px -18px #000}
  .hero-m .tag{font-size:11px;letter-spacing:.22em;color:#f0a592}
  .hero-m h2{font:600 clamp(22px,3.6vw,36px)/1.1 Literata,Georgia,serif;margin:8px 0}
  .hero-m p{color:#d7cbbd;margin:0 0 14px;font-size:14px}
  .hero-m .chips{display:flex;gap:6px;flex-wrap:wrap}
  .hero-m .chips span{font-size:11.5px;border:1px solid #ffffff33;border-radius:999px;padding:2px 10px;color:#eadfd2}
  @media (max-width:640px){.hero-m{grid-template-columns:100px 1fr;gap:14px;padding:16px}}
  .faixa-m h3{font:500 19px Literata,Georgia,serif;margin:0 0 12px}
  .rolo-m{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .rolo-m .card{width:136px;flex:none}
  .card .t{font-family:Literata,Georgia,serif;font-size:14px;line-height:1.3;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .g{font-size:11.5px;color:var(--tinta2);margin-top:2px}
  .mais{display:block;margin:28px auto 0}
  .credito-m{font-size:12px;color:var(--tinta2);margin-top:30px;text-align:center}
  .estado-m{color:var(--tinta2);padding:30px 0;text-align:center}
  /* ficha */
  .veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
  .ficha{background:var(--papel);color:var(--tinta);border-radius:14px;max-width:860px;width:100%;padding:22px;position:relative}
  .fechar{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--tinta2);font-size:26px;cursor:pointer}
  .ficha-topo{display:grid;grid-template-columns:190px 1fr;gap:22px}
  .ficha-topo img{width:100%;border-radius:6px;box-shadow:0 18px 36px -18px rgba(0,0,0,.7)}
  .ficha h2{font-family:Literata,Georgia,serif;font-weight:500;font-size:26px;margin:0 0 2px;line-height:1.15}
  .orig{color:var(--tinta2);font-size:13px}
  .dados{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--tinta2);margin:10px 0}
  .onde h3,.ficha h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta2);margin:18px 0 8px;font-weight:600}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{border:1px solid var(--linha);border-radius:8px;padding:7px 12px;text-decoration:none;font-size:13.5px}
  .links a.pt{background:var(--acento);border-color:var(--acento);color:#fff}
  .links a small{opacity:.75;margin-left:4px}
  .sinopse{white-space:pre-line;font-size:14px;line-height:1.55;max-height:9.5em;overflow:hidden}
  .sinopse.aberta{max-height:none}
  .parecidos{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .parecidos .card{width:110px;flex:none}
  @media (max-width:560px){
    .ficha-topo{grid-template-columns:120px 1fr;gap:14px}
    .ficha h2{font-size:20px}
    .grade-m{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    .serie{grid-template-columns:104px 1fr;gap:12px;padding:12px}
    .serie h2{font-size:18px}
    .topo{grid-template-columns:1fr}
    .topo img{max-width:220px}
    .caps{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }
</style>
<link rel="stylesheet" href="/fio-temas.css">
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
</head>
<body data-area="quadrinhos">
<main id="main"><p class="sub">abrindo…</p></main>
<script src="/fio-cabecalho.js"></script>
<script src="/quadrinhos.js"></script>
</body>
</html>
