<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- O fio.
       Livro encadernado à mão é cosido: um fio atravessa os cadernos e os
       segura juntos. É a imagem literal do nome e da ideia — uma obra puxa a
       seguinte, e o que existe entre elas é a linha.
       Traço só, ponta redonda: aos 16 pixels da aba do navegador ainda se lê
       como um fio, e não como uma mancha. -->
  <rect width="32" height="32" rx="7" fill="#7a2e2e"/>
  <path d="M11 6 C 11 12, 21 12, 21 16 C 21 20, 11 20, 11 24 C 11 27, 15 27.5, 18 26.5"
        fill="none" stroke="#fbf9f5" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11" cy="6" r="1.9" fill="#fbf9f5"/>
</svg>
