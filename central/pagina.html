<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central do Fio</title>
<link rel="stylesheet" href="pagina.css?t=__SEGREDO__">
</head>
<body data-segredo="__SEGREDO__">

<header class="topo">
  <div class="titulo">
    <h1>Central</h1>
    <p class="onde" id="onde">carregando…</p>
  </div>
  <div class="acoes-topo">
    <span class="idade" id="idade"></span>
    <button id="atualizar" class="botao">Atualizar</button>
  </div>
</header>

<div class="aviso" id="aviso" hidden></div>

<nav class="abas" id="abas"></nav>

<main id="corpo">
  <p class="carregando">Perguntando à VPS… a primeira vez leva uns 20 segundos,
  porque ela percorre os volumes e conta o banco inteiro.</p>
</main>

<!-- A janela de confirmação de uma ação. Ela existe separada e sempre com o
     mesmo formato, porque a pergunta "posso?" só vale se vier junto com o que
     acontece se der errado — e isso não pode depender de lembrar de escrever. -->
<dialog id="confirmar" class="confirmar">
  <h2 id="conf-nome"></h2>
  <dl>
    <dt>O que faz</dt><dd id="conf-faz"></dd>
    <dt>O que estraga se der errado</dt><dd id="conf-estraga"></dd>
    <dt>Quanto demora</dt><dd id="conf-demora"></dd>
  </dl>
  <div class="conf-botoes">
    <button id="conf-nao" class="botao">Deixa pra lá</button>
    <button id="conf-sim" class="botao perigo">Pode fazer</button>
  </div>
</dialog>

<script src="pagina.js?t=__SEGREDO__"></script>
</body>
</html>
