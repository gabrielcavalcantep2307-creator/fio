# O Fio na VPS.
#
# Três serviços: `caddy` (portas 80/443 e os certificados), e dois da mesma
# imagem — `fio` (a API e o site) e `esteira` (o trabalhador que traduz a
# fila para sempre).
#
# O Caddy é NOSSO desde 19/09/2026. Antes ele era do Wallt e a Fiolib era
# convidada; agora o Wallt é que entra como convidado (infra/Caddyfile).
#
# Antes de subir: copie `.env.exemplo` para `.env` e preencha.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Rede do host: o Caddy fala com o site em 127.0.0.1:8787 e, enquanto o
    # Wallt existir, com o LiveKit dele (7880) e o crachá (3000).
    network_mode: host
    mem_limit: 192m
    # Se ele cair, cai tudo: fica ao lado do site no fim da fila do OOM.
    oom_score_adj: -500
    volumes:
      # Caddyfile, fiolib.caddy e convidados/ (bash infra/publicar-caddy.sh)
      - /opt/fio/caddy:/etc/caddy:ro
      - /opt/fio/logs:/var/log/fiolib
      # O site do Wallt, convidado. Apagar esta linha quando o Wallt morrer.
      - /opt/picord/site:/srv/wallt:ro
      # Os certificados. Na troca vieram copiados do volume do Wallt, para
      # não pedir todos de novo ao Let's Encrypt de uma vez.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  fio:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    # Só no localhost. A porta NÃO é exposta para a internet: quem fala com
    # ela é o Caddy, do mesmo host. Publicar em 0.0.0.0 seria abrir o servidor
    # sem TLS ao lado do que tem TLS, e alguém acharia.
    ports:
      - '127.0.0.1:8787:8787'
    # Teto de memória: um processo que estoure tem que morrer e voltar
    # sozinho, não levar a máquina (2 GB) junto.
    mem_limit: 320m
    # PRIORIDADE DA FIOLIB (19/09/2026). A máquina é dividida com o Wallt e
    # a soma dos tetos passa da memória real. Se faltar memória para todo
    # mundo, o sistema escolhe quem matar pela nota abaixo: -500 põe o site
    # no fim da lista. E, na briga pela CPU, ele recebe o dobro da fatia.
    oom_score_adj: -500
    cpu_shares: 2048
    environment:
      FIO_PORTA: 8787
      FIO_SITE: ${FIO_SITE}
      FIO_BANCO: /dados/catalogo.db
      FIO_ESTATICO: /site
      FIO_JURISDICAO: ${FIO_JURISDICAO:-BR}
      # A porta da casa. Sem esta linha o servidor tranca sozinho, que é o
      # certo: esta biblioteca é para o dono e os amigos dele, e entra quem
      # tem convite. Ponha 'aberto' só se um dia a decisão mudar.
      FIO_CONVITE: ${FIO_CONVITE:-obrigatorio}
      # Vazio = só a própria origem. É o certo em produção.
      FIO_ORIGENS: ${FIO_ORIGENS:-}
      # Entrar com o Google (servidor/google.mjs). Vazias = botão leva a um
      # aviso de "ainda não ligado". A DEEPL_CHAVE NÃO entra aqui: quem
      # traduz é o serviço `esteira`, abaixo, e só ele a recebe.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FIO_HOSTS_GOOGLE: ${FIO_HOSTS_GOOGLE:-fiolib.com.br}
      # 'ligado' depois de cadastrar os endereços de volta no console do Google
      FIO_GOOGLE: ${FIO_GOOGLE:-}
      # Gmail(s) do dono: entram direto na conta FIO_GOOGLE_DONO_CONTA (curador)
      FIO_GOOGLE_DONO: ${FIO_GOOGLE_DONO:-}
      FIO_GOOGLE_DONO_CONTA: ${FIO_GOOGLE_DONO_CONTA:-curador}
      # O endereço secreto do painel (servidor/http/painel.mjs). Vazio = painel
      # desligado. Mora só no .env da VPS, nunca no git.
      FIO_PAINEL: ${FIO_PAINEL:-}
      # Saída de emergência: 'permitida' deixa a administração entrar com senha
      # mesmo com o Google ligado (servidor/contas.mjs, adminSoPeloGoogle).
      FIO_ADMIN_SENHA: ${FIO_ADMIN_SENHA:-}
    volumes:
      # O banco: catálogo, contas e sessões. É o único estado que importa.
      - dados:/dados
      # O site construído. Só leitura — o servidor nunca escreve aqui.
      - /opt/fio/site:/site:ro
      # O retrato da VPS para a aba Controle do painel (servidor/controle.mjs):
      # quando foi o backup, a cópia no PC, a versão no ar. Quem escreve é o
      # root da VPS; o site só lê. NÃO se monta o socket do Docker aqui: seria
      # dar a máquina inteira a quem invadisse o site.
      - /opt/fio/estado:/estado:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # A esteira de tradução, para sempre (servidor/esteira-trabalhador.mjs).
  # Container à parte para um livro pesado nunca travar nem derrubar o site;
  # mesmo banco (volume `dados`) e a pasta de dados do site com escrita, para
  # republicar o catálogo quando um livro fica pronto.
  esteira:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['node', 'servidor/esteira-trabalhador.mjs']
    restart: unless-stopped
    depends_on:
      - fio
    mem_limit: 448m
    # Deixa sempre CPU para o site: traduzir é esperar a rede, e o que pesa
    # (instalar, republicar) pode levar alguns segundos a mais sem problema.
    cpus: 0.8
    # Abaixo do site, acima do resto: a esteira retoma sozinha de onde
    # parou, então é ela que cede primeiro dentro da Fiolib.
    oom_score_adj: -200
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      FIO_BANCO: /dados/catalogo.db
      FIO_JURISDICAO: ${FIO_JURISDICAO:-BR}
      # cadernos e traduções prontas: dentro do volume, sobrevivem a redeploy
      FIO_TRADUCOES: /dados/esteira
      FIO_SITE_DADOS: /site-dados
      DEEPL_CHAVE: ${DEEPL_CHAVE:-}
      DEEPL_RESERVA: ${DEEPL_RESERVA:-200000}
      FIO_PARALELO: ${FIO_PARALELO:-8}
    volumes:
      - dados:/dados
      - /opt/fio/site/dados:/site-dados
    # Roda para sempre: o log não pode crescer para sempre junto.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  dados:
  caddy_data:
  caddy_config:
