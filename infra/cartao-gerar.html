<!doctype html>
<!--
  O cartão de compartilhamento da Fiolib (og:image), desenhado aqui.

  Por que uma página e não um arquivo pronto no repositório: a marca é
  Literata, e desenhar texto com a fonte certa precisa de um navegador. Esta
  página abre, desenha no canvas e baixa o JPEG. Rodar de novo só é preciso se
  a marca ou a frase mudarem.

  Como usar:
    1. abra este arquivo no navegador (ou sirva-o do próprio site, para a
       fonte Literata carregar da mesma origem);
    2. clique em "Baixar cartao.jpg";
    3. copie para /opt/fio/site/cartao.jpg na VPS.

  1200x630 é a medida que o Facebook, o WhatsApp, o Telegram, o X e o Reddit
  usam para o cartão grande. Menor que 600x315 nenhum deles aumenta.
-->
<meta charset="utf-8">
<title>Cartão de compartilhamento — Fiolib</title>
<style>
  body { background: #222; color: #eee; font: 15px/1.5 system-ui, sans-serif; padding: 24px; }
  canvas { width: 100%; max-width: 900px; height: auto; display: block; margin: 16px 0; }
  button { font: 15px system-ui; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; }
</style>
<h1 style="font-weight:500">Cartão de compartilhamento</h1>
<canvas id="c" width="1200" height="630"></canvas>
<button id="b">Baixar cartao.jpg</button>
<script>
(async () => {
  const c = document.getElementById('c')
  const x = c.getContext('2d')
  try { await document.fonts.load('600 96px Literata'); await document.fonts.load('400 28px Inter') } catch {}

  // fundo: o mesmo tom do destaque da home, com o véu de acento no canto
  const g = x.createLinearGradient(0, 0, 1200, 630)
  g.addColorStop(0, '#1b1411'); g.addColorStop(1, '#0e0b09')
  x.fillStyle = g; x.fillRect(0, 0, 1200, 630)
  const r = x.createRadialGradient(240, 300, 20, 240, 300, 620)
  r.addColorStop(0, 'rgba(122,46,46,.55)'); r.addColorStop(1, 'rgba(122,46,46,0)')
  x.fillStyle = r; x.fillRect(0, 0, 1200, 630)

  // a barra vinho da marca
  x.fillStyle = '#7a2e2e'; x.fillRect(0, 0, 14, 630)

  x.fillStyle = '#f3ece2'; x.font = '600 96px Literata, Georgia, serif'
  x.fillText('Fiolib', 96, 250)

  x.fillStyle = '#e8cfc4'; x.font = '400 38px Literata, Georgia, serif'
  x.fillText('Biblioteca online e gratuita', 100, 330)
  x.fillText('de livros em português', 100, 386)

  x.strokeStyle = 'rgba(243,236,226,.22)'; x.lineWidth = 1
  x.beginPath(); x.moveTo(100, 436); x.lineTo(1104, 436); x.stroke()

  x.fillStyle = '#c9b3a8'; x.font = '400 27px Inter, system-ui, sans-serif'
  x.fillText('Clássicos, poesia, contos e as leis brasileiras — sem anúncio.', 100, 492)

  x.fillStyle = '#f0a592'; x.font = '500 30px Inter, system-ui, sans-serif'
  x.fillText('fiolib.com.br', 100, 556)

  document.getElementById('b').onclick = () => {
    const a = document.createElement('a')
    a.download = 'cartao.jpg'
    a.href = c.toDataURL('image/jpeg', 0.8)
    a.click()
  }
})()
</script>
