<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Fiolib</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/fio-temas.css">
<style>
  /* O painel usa as cores DO SITE (fio-temas.css dá --papel, --papel2,
     --tinta, --tinta2, --linha e --acento conforme o tema escolhido lá).
     Até 20/09/2026 ele tinha uma paleta verde só dele, e destoava.
       --pg      o fundo da página (o "papel" do site)
       --cartao  o fundo das caixas (o "papel 2" do site) */
  :root{
    --pg:var(--papel,#fbf9f5); --cartao:var(--papel2,#f2eee6);
    --alerta:#c0392b; --dourado:#b08d57;
  }
  html[data-tema=noturno],html[data-tema=carvao],html[data-tema=penumbra],
  html[data-tema=musgo],html[data-tema=tinta],html[data-tema=ambar]{
    --alerta:#e0846f; --dourado:#d2aa5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pg);color:var(--tinta);
    font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  h1,h2,h3{font-family:Literata,Georgia,"Times New Roman",serif}
  .topo-painel{max-width:1000px;margin:0 auto;padding:22px 24px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  .quem{color:var(--tinta2);font-size:13px}
  main{max-width:1000px;margin:0 auto;padding:22px 24px 80px}
  section{margin-bottom:34px}
  h2{font-size:15px;margin:0 0 12px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.6px;font-family:ui-sans-serif,system-ui,sans-serif}
  .cartoes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:14px 16px}
  .cartao .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;font-family:ui-sans-serif,system-ui,sans-serif}
  .cartao .r{color:var(--tinta2);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--cartao);
    border:1px solid var(--linha);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--linha)}
  th{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  .selo{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--linha);
    font-family:ui-sans-serif,system-ui,sans-serif;white-space:nowrap}
  .selo.espera{color:var(--dourado);border-color:var(--dourado)}
  .selo.na_esteira{color:var(--acento);border-color:var(--acento)}
  .selo.pronto{color:var(--acento);border-color:var(--acento);background:color-mix(in srgb,var(--acento) 12%,transparent)}
  .selo.erro{color:var(--alerta);border-color:var(--alerta)}
  form.add{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:16px}
  .campos{display:grid;gap:10px;grid-template-columns:2fr 2fr 1fr 1fr;align-items:end}
  label{display:block;font-size:12px;color:var(--tinta2);margin-bottom:3px;font-family:ui-sans-serif,system-ui,sans-serif}
  input,textarea{width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:7px;
    background:var(--pg);color:var(--tinta);font:inherit;font-size:14px}
  textarea{min-height:88px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  button{background:var(--acento);color:#fff;border:none;border-radius:7px;padding:9px 16px;
    font:inherit;font-size:14px;cursor:pointer;font-family:ui-sans-serif,system-ui,sans-serif}
  button.fraco{background:none;color:var(--tinta2);border:1px solid var(--linha)}
  button:disabled{opacity:.5;cursor:progress}
  .aba{display:flex;gap:8px;margin:14px 0}
  .aba button{background:none;color:var(--tinta2);border:1px solid var(--linha)}
  .aba button[aria-selected=true]{background:var(--cartao);color:var(--tinta);border-color:var(--acento)}
  .ajuda{color:var(--tinta2);font-size:13px;max-width:70ch}
  .recado{padding:10px 14px;border-radius:8px;margin:12px 0;font-size:14px}
  .recado.bom{background:color-mix(in srgb,var(--acento) 14%,transparent);color:var(--acento)}
  .recado.ruim{background:color-mix(in srgb,var(--alerta) 14%,transparent);color:var(--alerta)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .vazio{color:var(--tinta2);padding:20px;text-align:center}
  .grupo{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .grupo h3{margin:0;font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif}
  .liga{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--linha)}
  .liga:first-of-type{border-top:none}
  .liga span{font-size:14px}
  .liga input[type=checkbox]{width:auto;accent-color:var(--acento);transform:scale(1.3)}
  .grupo .cartoes{margin-top:4px}
  .central-leitor{margin-top:18px;border:1px solid var(--linha);border-radius:12px;background:var(--cartao);overflow:hidden}
  .central-topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .central-topo h3{margin:0;font:600 20px Literata,Georgia,serif}.central-topo p{margin:3px 0 0;color:var(--tinta2);font-size:12px}
  .central-abas{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--linha);overflow:auto}
  .central-abas button{background:none;color:var(--tinta2);border-radius:0;padding:11px 9px;border-bottom:2px solid transparent;white-space:nowrap}
  .central-abas button[aria-selected=true]{color:var(--acento);border-color:var(--acento)}
  .central-corpo{padding:16px 18px}.central-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .central-bloco{border:1px solid var(--linha);border-radius:9px;padding:12px;background:var(--pg)}
  .central-bloco h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta2)}
  .central-linha{padding:8px 0;border-top:1px solid var(--linha);font-size:13px}.central-linha:first-of-type{border-top:0}
  .central-linha small{display:block;color:var(--tinta2)}.privacidade{background:color-mix(in srgb,var(--dourado) 10%,transparent);padding:10px 12px;border-radius:8px;color:var(--tinta2);font-size:12px;margin-bottom:12px}
  .ver-conta{background:none;color:var(--acento);border:0;padding:2px 0;font-size:12px;text-decoration:underline}
  .areas-painel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
  .areas-painel button{padding:18px;text-align:left;background:var(--cartao);color:var(--tinta);border:2px solid var(--linha);border-radius:12px}
  .areas-painel button[aria-pressed=true]{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 10%,var(--pg))}
  .areas-painel strong{display:block;font-size:21px}.areas-painel span{display:block;font-size:12px;margin-top:4px;color:var(--tinta2)}
  .subareas-painel{flex-wrap:wrap;margin-bottom:22px}
  @media(max-width:480px){.areas-painel button{padding:12px}.areas-painel span{font-size:11px}}
  a{color:var(--acento)}
  @media(max-width:640px){.campos{grid-template-columns:1fr 1fr}.central-grade{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/fio-cabecalho.css">
<script src="/fio-dono.js"></script>
<script src="/fio-api.js"></script>
<script src="/fio-tema.js"></script>
</head>
<body data-area="painel">
<div class="topo-painel">
  <h1>Painel da Fiolib</h1>
  <span class="quem" id="quem"></span>
</div>
<main id="main">
  <p class="ajuda" id="carregando">Conferindo o acesso…</p>
</main>
<script src="/fio-cabecalho.js"></script>
<script src="{{PAINEL}}/painel.js"></script>
</body>
</html>
